<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoalRush — Login</title><link rel="stylesheet" href="styles.css"><style>.login-card{max-width:430px;margin:auto;padding:0}.login-card h1{font:600 38px "Space Grotesk";margin:12px 0}.login-card .submit{width:100%;margin-top:10px}.login-card .login{margin-top:18px}</style></head>
<body><main class="shell"><section class="art-panel"><div class="brand"><span class="brand-mark"></span> GOALRUSH</div><div class="orbital-stage"><div class="planet"></div><div class="planet-ring"></div></div><div class="art-copy"><p class="eyebrow">SPORT, SCORES & MOMENTS</p><h1>Welcome back,<br><em>you legend.</em></h1><p>Access your sports dashboard.</p></div></section><section class="form-panel"><div class="form-wrap login-card"><div class="step">MEMBER ACCESS</div><h1>Sign in</h1><p class="form-heading p" style="color:#85868f">Continue to your dashboard.</p><form id="loginForm"><label>Email address<input name="email" type="email" placeholder="you@example.com" required></label><label>Password<div class="password-field"><input name="password" type="password" placeholder="Your password" required><button type="button" id="toggleLoginPassword">Show</button></div></label><button class="submit" type="submit"><span>Sign in</span><b>↗</b></button><p id="loginMessage" class="message" role="status"></p></form><p class="login">New here? <a href="index.html">Create account</a></p></div></section></main><script src="login.js"></script></body></html>
